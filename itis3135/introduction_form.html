<!DOCTYPE html>

<html lang = "en">

<head>
    <title>Sumiran Juthuga's Serene Jackrabbit | ITIS3135 | Introduction Form</title>
        <!--This link below is the favicon-->
    <link rel="icon" type="image/svg+xml" href="images/better_logo.svg">
    <link rel="stylesheet" href="styles/default.css">
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://lint.page/kit/4d0fe3.js" crossorigin="anonymous"></script>
</head>
<body>
    <div data-include="components/header.html"></div>
    <main class="container">
        <h2>Introduction Form</h2>
        <h3>Please submit the form below</h3>
        <form>
            <fieldset>
                <legend>Personal Information</legend>
                <label for="first-name">First Name</label>
                <input type="text" id="first-name" value="Sumiran" placeholder="Enter your first name" required>
                <br>
                <label for="middle-name">Middle Name/Initial (optional)</label>
                <input type="text" id="middle-name" value="" placeholder="Enter middle name if applicable">
                <br>
                <label for="nickname">Nickname (optional)</label>
                <input type="text" id="nickname" value="&quot;Sum&quot;" placeholder="Enter nickname if applicable">
                <br>
                <label for="last-name">Last Name</label>
                <input type="text" id="last-name" value="Juthuga" placeholder="Enter your last name" required>
                <br>
            </fieldset>

            <fieldset>
                <legend>Mascot Information</legend>
                <label for="mascot-adj">Mascot Adjective</label>
                <input type="text" id="mascot-adj" value="Serene" placeholder="Enter the adjective" required>
                <br>
                <label for="mascot-animal">Mascot Animal</label>
                <input type="text" id="mascot-animal" value="Jackrabbit" placeholder="Enter the animal" required>
                <br>
                <label for="divider">Divider</label>
                <input type="text" id="divider" value="|" placeholder="" required>
            </fieldset>

            <fieldset>
                <legend>Picture</legend>
                <label for="picture">Picture: </label>
                <input type="file" id="picture" accept="image/*">
                <br>
                <label for="picture-caption">Picture Caption: </label>
                <input type="text" id="picture-caption" value="At the Colvard building" required>
            </fieldset>

            <fieldset>
                <legend>Personal Details</legend>
                <label for="personal-statement">Personal Statement</label>
                <br>
                <textarea id="personal-statement" rows="4" cols="30" class="input-width" placeholder="Introduce yourself..." required>
                    This is Sumiran Juthuga, a Computer Science senior studying with a concentration in Cybersecurity. 
                    I am taking summer courses at UNC Charlotte for the second semester, and I am excited to dive into 
                    practicing front-end development. I am interested in learning about the uses of the 
                    latest technologies and how we can utilize them for the common good.
                </textarea>
                <br>
                <label for="personal-background">Personal Background</label>
                <br>
                <textarea id="personal-background" rows="4" cols="30" class="input-width" placeholder="Details about your background" required>
                    I am originally from Atlanta, and I moved to Charlotte when I was in high school. 
                    I like to take walks, explore new places and read books in my free time.
                </textarea>
                <br>
                <label for="professional-background">Professional Background</label>
                <br>
                <textarea id="professional-background" rows="4" cols="30" class="input-width" placeholder="Details about professional experience" required>
                    I have worked in an internship that involves technology and marketing.
                </textarea>
                <br>
                <label for="academic-background">Academic Background</label>
                <br>
                <textarea id="academic-background" rows="4" cols="30" class="input-width" placeholder="Details about academic background" required>
                    I am studying computer science with a concentration in cyber security. 
                    I plan to advance my knowledge through applying for internships that are related to blue team roles.
                </textarea>
                <br>
                <label for="primary-computer">Primary Computer</label>
                <br>
                <textarea id="primary-computer" rows="4" cols="20" class="input-width" placeholder="Computer being used" required>
                    HP, Windows 11 Home, AMD Ryzer laptop
                </textarea>
            </fieldset>
            <button type="submit">Submit</button>
            <button type="reset">Reset</button>
            <button type="button">Clear</button>
        </form>
    </main>
    <div data-include="components/footer.html"></div>
    <script src="scripts/HTMLInclude.min.js"></script>
    <script>
        document
        .querySelector("button[type='button']")
        .addEventListener("click", function (event) {
            const elements = document.querySelectorAll("form input, form textarea, form select");
            Array.from(elements).forEach((element) => {
                if (element.tagName === "SELECT") {
                    element.selectedIndex = 0;
                } else {
                    element.value = "";
                }
            });
        });
    </script>
</body>
</html>
