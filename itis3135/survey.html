<!DOCTYPE html>

<html lang = "en">

<head>
    <title>Sumiran Juthuga's Serene Jackrabbit | ITIS3135 | Survey</title>
        <!--This link below is the favicon-->
    <link rel="icon" type="image/svg+xml" href="images/better_logo.svg">
    <link rel="stylesheet" href="styles/default.css">
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://lint.page/kit/4d0fe3.js" crossorigin="anonymous"></script>
</head>
<body>
    
    <div data-include="components/header.html"></div>
    <main>
        <h2>Survey</h2>
        <p id="description">
            Please fill out this form for us to better understand your preferred wellness routine.
        </p>
        
        <form id="survey-form">
            
            <label for="name" id="name-label">Name: </label>
            <input id="name" type="text" placeholder = "e.g. Aaron Farr"
            required />
            <br>
            <label for="email" id="email-label">Email: </label>
            <input id="email" type="email" required placeholder="example@email.com"> <!--5-->
            <br>
            <label for="number" id="number-label">Age: </label>
            <input id="number" type="number" min="7" max = "100" required/>
            <hr>
            

            
            <label for="stress-levels">Stress Levels during the week:</label>
            <select name="level" id="stress-levels">
            <option value="def" selected>[select]</option>
            <option value="none">None</option>
            <option value="beginner" >Low</option>
            <option value="intermediate">Medium</option>
            <option value = "advanced">High</option>
            </select>
            <hr>
        

            <fieldset>
                <!-- <label id="availability">Best Availability to Exercise: </label><br> -->

                <legend>Best Availability to Exercise: </legend>

                <input type="radio" id="morning" name="availability" value="morning">
                <label for="morning">Morning</label><br>

                <input type="radio" id="afternoon" name="availability" value="afternoon">
                <label for="afternoon">Afternoon</label><br>

                <input type="radio" id="evening" name="availability" value="evening">
                <label for="evening">Evening</label>
            </fieldset>
            <hr>
    
          
            
            <!-- <label for="fitness-goals">Physical Fitness Goals:</label>
            <br>
            <label>
                <input type="checkbox" value="heart" id="fitness-goals">Improve Heart Health<br>
            </label>
            <label>
                <input type="checkbox" value="muscles" id="fitness-goals">Strengthen Muscles<br>
            </label>
            <label>
                <input type="checkbox" value="weight-loss" id="fitness-goals">Weight Loss
            </label> -->
            <label class="fitness-title">Physical Fitness Goals:</label>
            <br>
            <label for="goal-heart">Improve Heart Health</label>
            <input type="checkbox" id="goal-heart" class="fitness" value="heart">
            <br>
            <label for="goal-muscles">Strengthen Muscles</label>
            <input type="checkbox" id="goal-muscles" class="fitness" value="muscles">
            <br>
            <label for="goal-weight">Weight Loss</label>
            <input type="checkbox" id="goal-weight" class="fitness" value="weight-loss">
            <hr>
        
            <label for="comments">Additional Comments: </label>
            <br>
            <textarea id="comments" name="comments" rows="3" cols="30" placeholder="Enter your comments here"></textarea>
            <hr>
            <input type="submit" id="submit" value="Submit Form">
        </form>
    </main>
    <div data-include="components/footer.html"></div>
    <script src="scripts/HTMLInclude.min.js"></script>
</body>
</html>
