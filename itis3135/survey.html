<!DOCTYPE html>

<html lang = "en">

<head>
    <title>Sumiran Juthuga's Serene Jackrabbit | ITIS3135 | Home</title>
        <!--This link below is the favicon-->
    <link rel="icon" type="image/svg+xml" href="images/better_logo.svg">
    <link rel="stylesheet" href="styles/default.css">
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://lint.page/kit/4d0fe3.js" crossorigin="anonymous"></script>
</head>
<body>
    
    <div data-include="components/header.html"></div>
    <main>
        <h2>Survey</h2>
        <p id="description">
            Please fill out this form for us to better understand your preferred wellness routine.
        </p>
        
        <form id="survey-form">
            
            <label for="name" id="name-label">Name: </label>
            <input id="name" type="text" placeholder = "e.g. Aaron Farr"
            required />
            <br>
            <label for="email" id="email-label">Email: </label>
            <input id="email" type="email" required placeholder="example@email.com"> <!--5-->
            <br>
            <label for="number" id="number-label">Age: </label>
            <input id="number" type="number" min="7" max = "100" required/>
            <hr>
            

            
            <label>Stress Levels during the week:</label>
            <select name="level" id="dropdown">
            <option value="def" selected>[select]</option>
            <option value="none">None</option>
            <option value="beginner" >Low</option>
            <option value="intermediate">Medium</option>
            <option value = "advanced">High</option>
            </select>
            <hr>
        

            
            <label id="availability">Best Availability to Exercise: </label><br>
            <input type="radio" id="morning" name="availability" value="morning">
            <label for="morning">Morning</label><br>
            <input type="radio" id="afternoon" name="availability" value="afternoon">
            <label for="afternoon">Afternoon</label><br>
            <input type="radio" id="evening" name="availability" value="evening">
            <label for="evening">Evening</label>
            <hr>
    
          
            
            <label>Physical Fitness Goals:</label>
            <br>
            <input type="checkbox" value="heart">Improve Heart Health<br>
            <input type="checkbox" value="muscles">Strengthen Muscles<br>
            <input type="checkbox" value="weight-loss">Weight Loss
            <hr>
        
            <label for="comments">Additional Comments: </label>
            <br>
            <textarea id="comments" name="comments" rows="3" cols="30" placeholder="Enter your comments here"></textarea>
            <hr>
            <input type="submit" id="submit">
        
            

            
        </form>
    </main>
    <div data-include="components/footer.html"></div>
    <script src="scripts/HTMLInclude.min.js"></script>
</body>
</html>
