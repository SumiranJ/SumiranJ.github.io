<!DOCTYPE html>

<html lang = "en">

<head>
    <title>Serene Jackrabbit Physical Wellness</title>
        <!--This link below is the favicon-->
    <link rel="icon" type="image/svg+xml" href="images/better_logo.svg">
    <!-- <link rel="stylesheet" href="styles/default.css"> -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
        body, header, footer{
            max-width: 800px;
            margin: 0 auto;
            text-align:center;
            background-color:#003049;
        }

        h1, h2, h3{
            font-family:'Trebuchet MS', 'Lucida Sans Unicode', 'Lucida Grande', 'Lucida Sans', Arial, sans-serif;
            color:#f77f00;
        }

        p, ul, ol, li, nav, blockquote{
            color:#eae2b7;
            text-align:left;
            font-family: Cambria, Cochin, Georgia, Times, 'Times New Roman', serif;
        }

        a, a:visited{
            color:#fcbf49;
        }

        section{
            border: 2px solid #d62828;
            padding:10px;
            border-radius: 10px;
            display:none;
            margin:10px;
        }
        section.active{
            display:block;
        }
        nav a.active{
            font-weight:bold;
        }
    </style>
    <script src="https://lint.page/kit/4d0fe3.js" crossorigin="anonymous"></script>
</head>
<body>
    <div data-include="components/header.html"></div>
    <main>
        <section id="home" class="active">
            <h2>Home</h2>
            <p>Welcome to the Business</p>
        </section>
        <section id="about">
            <h2>About</h2>
            <p>This company is intended for...</p>
        </section>
        <section id="product">
            <h2>Products</h2>
            <p>Our products inlcude...</p>
        </section>
        <section id="order">
            <h2>Order</h2>
            <p>You can order these products by...</p>
        </section>
        <section id="contact">
            <h2>Contact</h2>
            <p>You can contact us through...</p>
        </section>
        
    </main>
    <div data-include="components/footer.html"></div>
    <script>
            document.addEventListener("DOMContentLoaded", () => {
            const links = document.querySelectorAll("nav a");
            const sections = document.querySelectorAll("section");

            links.forEach((link) => {
                link.addEventListener("click", (event) => {

                event.preventDefault(); 


                links.forEach((l) => l.classList.remove("active"));
                sections.forEach((s) => s.classList.remove("active"));


                link.classList.add("active");

                
                const targetId = link.getAttribute("data-target");
                const targetSection = document.getElementById(targetId);
                
                if (targetSection) {
                    targetSection.classList.add("active");
                }
                });
            });
            });

        </script>
    <div data-include="components/footer.html"></div>
    <script src="scripts/HTMLInclude.min.js"></script>
    <script src="https://divonbriesen.github.io/web123/scripts/standards-check.js" defer></script>
</body>
</html>
